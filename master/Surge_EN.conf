# > Subnet 策略组的作用是：根据当前所处的网络环境（Wi-Fi SSID / BSSID / Router IP / 网络类型等）来自动选择策略
# > 如果内网部署了全局旁路网关，则把route地址改为旁路网关ip，也可以写ssid:name替代
内网策略 = subnet, default = Home, "SSID:Redmi_7185_5G" = DIRECT, "SSID:Redmi_7185" = DIRECT

